<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Cloth House - Add Stock</title>
    <link rel="stylesheet" href="../css/stock.css">
</head>
<body>

    <div class="page-wrapper">
        <div class="header">
            <a href="index.html" class="back-btn">
                <span class="arrow">&larr;</span> Back
            </a>
            <div class="title">Add Stock</div>
           
        </div>

        <main class="content-area">
            <form id="stockForm">
                <div class="form-card">
                    <div class="section-tag">
                        <span class="icon">📦</span> Product Details
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="productName">Product Name</label>
                            <input type="text" id="productName" placeholder="e.g. Banarasi Silk" required>
                        </div>

                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" id="quantity" placeholder="e.g. 100" min="1" required>
                        </div>

                        <div class="form-group">
                            <label for="pricePerUnit">Price per unit (₹)</label>
                            <input type="number" id="pricePerUnit" placeholder="e.g. 480" min="1" required>
                        </div>
                    </div>
                </div>

                <div class="actions-footer">
                    <button type="button" class="btn btn-clear" id="clearBtn">&times; Clear Form</button>
                    <button type="submit" class="btn btn-submit">+ Add to Stock</button>
                </div>
            </form>
        </main>
    </div>

    <script src="../js/stock.js"></script>
</body>
</html>
