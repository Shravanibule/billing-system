<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice — Shree Cloth House</title>
  <link rel="stylesheet" href="../css/invoice.css" />
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar no-print">
    <button class="btn-back" onclick="window.location.href='billing.html'">← Back</button>
    <span class="topbar-title">Invoice</span>
    <button class="btn-more" aria-label="More options">⋯</button>
  </div>

  <div class="page-container">

    <!-- INVOICE CARD -->
    <div class="invoice-card" id="invoice-print-area">

      <!-- Shop Header -->
      <div class="shop-header">
        <div class="shop-name">Shree Cloth House</div>
        <div class="shop-subtitle">Billing &amp; Inventory — Invoice</div>
      </div>

      <hr class="divider" />

      <!-- Invoice Meta Info -->
      <div class="invoice-meta">
        <div class="meta-row">
          <span class="meta-key">Bill no.</span>
          <span class="meta-val" id="inv-bill-no">—</span>
        </div>
        <div class="meta-row">
          <span class="meta-key">Date</span>
          <span class="meta-val" id="inv-date">—</span>
        </div>
        <div class="meta-row">
          <span class="meta-key">Customer</span>
          <span class="meta-val" id="inv-customer">—</span>
        </div>
        <div class="meta-row">
          <span class="meta-key">Mobile</span>
          <span class="meta-val" id="inv-mobile">—</span>
        </div>
        <div class="meta-row">
          <span class="meta-key">Payment</span>
          <span class="meta-val" id="inv-payment">—</span>
        </div>
      </div>

      <!-- Products Table -->
      <table class="product-table" id="product-table">
        <thead>
          <tr>
            <th class="col-item">Item</th>
            <th class="col-qty">Qty</th>
            <th class="col-rate">Rate</th>
            <th class="col-amount">Amount</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows injected by JS -->
        </tbody>
      </table>

      <!-- Summary -->
      <div class="summary-section">
        <div class="summary-row">
          <span class="summary-key">Subtotal</span>
          <span class="summary-val" id="inv-subtotal">₹0</span>
        </div>
        <div class="summary-row discount-row">
          <span class="summary-key" id="inv-discount-label">Discount (0%)</span>
          <span class="summary-val discount-val" id="inv-discount-amt">−₹0</span>
        </div>
        <div class="summary-total">
          <span class="total-key">Total Amount</span>
          <span class="total-val" id="inv-total">₹0</span>
        </div>
      </div>

      <!-- Thank You Note -->
      <div class="thank-you">Thank you for shopping with us!</div>

    </div><!-- end invoice-card -->

  </div><!-- end page-container -->

  <!-- BOTTOM BUTTONS -->
  <div class="bottom-bar no-print">
    <button class="btn-done" id="btn-done">Done</button>
    <button class="btn-print" id="btn-print">
      <span class="print-icon">🖨</span> Print
    </button>
  </div>

  <script src="../js/invoice.js"></script>
</body>
</html>
